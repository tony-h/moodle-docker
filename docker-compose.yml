services:
  db:
    image: mariadb:12.3
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --skip-innodb-read-only-compressed
    volumes:
      - ./db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  moodle:
    build:
      context: ./build-context
      dockerfile: Dockerfile
    image: local/moodle-docker:latest
    container_name: ${SITE_LABEL}
    restart: always
    extra_hosts:
      # Forces the container to use domain name instead of the internal IP
      # to prevent an unsecure SSL error with the embedded self-signed certs.
      - "${SITE_LABEL}:host-gateway"
    depends_on:
      - db
      - redis
    volumes:
      - ./moodledata:/var/www/moodledata
      - ./moodle:/var/www/html
      - ./backups/courses:/var/www/course-backups
      - ./logs:/var/log/apache2
      - ./supervisor:/var/log/supervisor
      # --- Advanced Configuration Overrides ---
      # Uncomment the lines below to hot-swap Apache and PHP settings without rebuilding the image.
      # - ./build-context/apache/site.conf:/etc/apache2/sites-available/000-default.conf:ro
      # - ./build-context/apache/php-overrides.ini:/usr/local/etc/php/conf.d/php-overrides.ini:ro
    environment:
      MOODLE_DB_TYPE: mariadb
      MOODLE_DB_HOST: db
      MOODLE_DB_PORT: 3306
      MOODLE_DB_NAME: ${MYSQL_DATABASE}
      MOODLE_DB_USER: ${MYSQL_USER}
      MOODLE_DB_PASSWORD: ${MYSQL_PASSWORD}
      MOODLE_WWW_ROOT: https://${DOMAIN}
      MOODLE_DATA_ROOT: /var/www/moodledata
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.moodlecron.schedule=@every 1m"
      - "ofelia.job-exec.moodlecron.command=/usr/local/bin/php /var/www/html/admin/cli/cron.php"
      - "ofelia.job-exec.moodlecron.user=www-data"
    networks:
      - default
      - gateway-net # <--- Allows Global Nginx to see it

  redis:
    image: redis:latest
    restart: always
    volumes:
      - redis_data:/data # Assigns a named volume to prevent anonymous leakage

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ${SITE_LABEL}-ofelia
    depends_on:
      - moodle
    command: daemon --docker --docker-filter name=${SITE_LABEL}
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: # Forces Docker to keep a maximum of 3 logs at 10MB each
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gateway-net:
    external: true

# Named volumes
volumes:
  redis_data:
